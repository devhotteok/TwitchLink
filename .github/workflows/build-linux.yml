name: Build Linux

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build_deb:
    name: Build .deb

    runs-on: ubuntu-22.04

    defaults:
      run:
        shell: bash

    env:
      PYTHON_VERSION: '3.12'
      APP_NAME: twitchlink
      DIRECTORY_NAME: twitchlink_${{ inputs.version }}-1_amd64
      OUTPUT_DEB: twitchlink_${{ inputs.version }}-1_amd64.deb
      FFMPEG_SOURCE: 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-N-127021-ge0c94b2d1c-linux64-gpl.tar.xz'

    steps:
    - name: Identify libc version
      run: echo "LIBC_VERSION=$(getconf GNU_LIBC_VERSION | grep -A 0 "glibc" | cut -d' ' -f2)" >> $GITHUB_ENV

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          /*
          !/.github/build/windows
          !/resources/dependencies/windows
          !/.github/build/macos
          !/resources/dependencies/macos
          !/.github/build/linux/io.github.devhotteok.TwitchLink.yml
        sparse-checkout-cone-mode: false
        
    - name: Download FFmpeg
      run: |
        curl -L -o ffmpeg_download.tar.xz ${{ env.FFMPEG_SOURCE }}
        mkdir ffmpeg_download
        tar -xf ffmpeg_download.tar.xz --strip-components 1 -C ffmpeg_download
        install -Dm755 ffmpeg_download/bin/ffmpeg resources/dependencies/linux/ffmpeg
        rm -r ffmpeg_download.tar.xz ffmpeg_download

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Prepare build files
      run: cp -r .github/build/linux/* .

    - name: Update control file with versions
      run: |
        sed -i 's/{{APP_VERSION}}/${{ inputs.version }}/g' DEBIAN/control
        sed -i "s/{{LIBC_VERSION}}/${LIBC_VERSION}/g" DEBIAN/control
        echo "✅ Updated debian control with app version: ${{ inputs.version }} and libc version: $LIBC_VERSION"

    - name: Build executible
      run: |
        pyinstaller TwitchLink.spec
        if [ $? -ne 0 ]; then
          echo "❌ Executible build failed"
          exit 1
        fi
        echo "✅ Built executible: ${{ env.APP_NAME }}"

    - name: Build .deb package
      run: |
        mv dist/${{ env.APP_NAME }} usr/share
        mkdir ${{ env.DIRECTORY_NAME }}
        mv DEBIAN usr ${{ env.DIRECTORY_NAME }}
        dpkg-deb --root-owner-group --build ${{ env.DIRECTORY_NAME }}

        if [ $? -ne 0 ]; then
          echo "❌ Failed to package .deb"
          exit 1
        fi
        echo "✅ Built: ${{ env.OUTPUT_DEB }}"

    - name: Upload .deb artifact
      uses: actions/upload-artifact@v4
      with:
        name: output_deb
        path: ${{ env.OUTPUT_DEB }}
    
        
  build_flatpak:
    name: Build flatpak

    runs-on: ubuntu-22.04
    needs: build_deb
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged

    env:
      OUTPUT_FLATPAK: twitchlink-${{ inputs.version }}-x86_64.flatpak

    steps:
    - name: Checkout flatpak manifest
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          /.github/build/linux/io.github.devhotteok.TwitchLink.yml
        sparse-checkout-cone-mode: false

    - name: Download .deb artifact
      uses: actions/download-artifact@v4
      with:
        name: output_deb

    - name: Prepare flatpak manifest
      run: cp -r .github/build/linux/io.github.devhotteok.TwitchLink.yml .
    
    - name: Update flatpak manifest with version
      run: |
        sed -i 's/{{APP_VERSION}}/${{ inputs.version }}/g' io.github.devhotteok.TwitchLink.yml
        echo "✅ Updated manifest with version: ${{ inputs.version }}"

    - name: Build flatpak bundle as artifact
      uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: ${{ env.OUTPUT_FLATPAK }}
        manifest-path: io.github.devhotteok.TwitchLink.yml
        artifact-name: output_flatpak


  upload:
    name: Upload packages

    runs-on: ubuntu-latest
    needs: [build_deb, build_flatpak]

    steps:
    - name: Download package artifacts
      uses: actions/download-artifact@v4

    - name: Upload to release
      uses: softprops/action-gh-release@v2
      with:
        fail_on_unmatched_files: true
        files: |
          output_deb/*.deb
          output_flatpak/*.flatpak