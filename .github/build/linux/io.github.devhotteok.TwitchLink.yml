id: io.github.devhotteok.TwitchLink
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: twitchlink

finish-args:
- --share=ipc
- --socket=fallback-x11
- --socket=wayland
- --device=dri
- --device=usb
- --share=network
- --filesystem=host:ro
- --filesystem=home:create
- --filesystem=/media:create
- --filesystem=/run/media:create
- --filesystem=/mnt:create

modules:
  - name: twitchlink
    buildsystem: simple
    build-commands:
      # Install FFmpeg
      - curl -L -o ffmpeg_download.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-07-31-14-10/ffmpeg-N-125875-g5d4d3bdc61-linux64-gpl.tar.xz
      - mkdir ffmpeg_download
      - tar -xf ffmpeg_download.tar.xz --strip-components 1 -C ffmpeg_download
      - mv ffmpeg_download/bin/ffmpeg resources/dependencies/linux
      - rm -r ffmpeg_download.tar.xz ffmpeg_download

      # Create python environment
      - python3.12 -m venv .venv
      - source .venv/bin/activate

      # Install dependencies
      - python -m pip install --upgrade pip
      - pip install -r requirements.txt
      - pip install pyinstaller

      # Prepare build files
      - cp -r .github/build/linux/* .

      # Build executable
      - pyinstaller TwitchLink.spec

      # Install program
      - install -Dm755 bin/twitchlink.sh app/bin/twitchlink.sh
      - install -Dm755 dist/TwitchLink/TwitchLink app/share/twitchlink/twitchlink
      - cp -rp dist/TwitchLink/_internal app/share/twitchlink
      - install -Dm755 share/applications/io.github.devhotteok.TwitchLink.desktop app/share/applications/io.github.devhotteok.TwitchLink.desktop
      - install -Dm644 share/metainfo/io.github.devhotteok.TwitchLink.metainfo.xml app/share/metainfo/io.github.devhotteok.TwitchLink.metainfo.xml
      - install -Dm644 share/icons/hicolor/16x16/apps/io.github.devhotteok.TwitchLink.png app/share/icons/hicolor/16x16/apps/io.github.devhotteok.TwitchLink.png
      - install -Dm644 share/icons/hicolor/24x24/apps/io.github.devhotteok.TwitchLink.png app/share/icons/hicolor/24x24/apps/io.github.devhotteok.TwitchLink.png
      - install -Dm644 share/icons/hicolor/32x32/apps/io.github.devhotteok.TwitchLink.png app/share/icons/hicolor/32x32/apps/io.github.devhotteok.TwitchLink.png
      - install -Dm644 share/icons/hicolor/48x48/apps/io.github.devhotteok.TwitchLink.png app/share/icons/hicolor/48x48/apps/io.github.devhotteok.TwitchLink.png
      - install -Dm644 share/icons/hicolor/64x64/apps/io.github.devhotteok.TwitchLink.png app/share/icons/hicolor/64x64/apps/io.github.devhotteok.TwitchLink.png
      - install -Dm644 share/icons/hicolor/128x128/apps/io.github.devhotteok.TwitchLink.png app/share/icons/hicolor/128x128/apps/io.github.devhotteok.TwitchLink.png
      - install -Dm644 share/icons/hicolor/256x256/apps/io.github.devhotteok.TwitchLink.png app/share/icons/hicolor/256x256/apps/io.github.devhotteok.TwitchLink.png
      - install -Dm644 share/icons/hicolor/scalable/apps/io.github.devhotteok.TwitchLink.png app/share/icons/hicolor/scalable/apps/io.github.devhotteok.TwitchLink.png
    sources:
      - type: git
        url: https://github.com/Aloxite1/TwitchLink.git
        branch: linux-support
